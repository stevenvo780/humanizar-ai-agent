[project]
name = "lumen-sandbox"
version = "0.1.0"
description = "Isolated, bounded terminal presets for Lumen"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
