name: Quality and publication safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable loopback-only CI credentials, never production configuration.
      LUMEN_TEST_DATABASE_URL: postgresql+psycopg://lumen_test:lumen_test@127.0.0.1:5432/lumen_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lumen_test
          POSTGRES_PASSWORD: lumen_test
          POSTGRES_DB: lumen_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --cpus 1
          --memory 512m
          --pids-limit 128
          --health-cmd "pg_isready -U lumen_test -d lumen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.21'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies and prepare Spec Kit
        run: make setup
      - name: Lint, types, tests and production build
        run: make check
      - name: Public source path audit
        run: python3 scripts/audit-public.py
      - name: Verify scanner release and scan complete public history
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/lumen-scanner"
          "$RUNNER_TEMP/lumen-scanner/gitleaks" git --redact=100 --no-banner --log-opts=--all .
      - name: Validate Docker configuration
        run: docker compose config --quiet

  docker:
    name: Docker build and integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: humanizar-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable demo configuration
        run: cp .env.example .env
      - name: Build and start isolated services
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify authentication, retrieval, docs and isolated terminal
        run: python3 scripts/smoke-docker.py
      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
