[project]
name = "lumen-backend"
version = "0.1.0"
description = "Grounded company assistant with Anthropic tools, persistent knowledge and MCP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=0.69,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "cryptography>=44,<51",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.12,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.6,<1"]
dev = ["mypy>=1.13,<2", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["docx.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
